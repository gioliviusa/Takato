<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKATO | Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#2B3A4A;--text:#F4F0EB;--accent:#8E9EAB;--serif:'Cormorant Garamond',serif;--sans:'Montserrat',sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:0;animation:vid 1.8s ease .2s forwards}
@keyframes vid{to{opacity:1}}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(43,58,74,.55) 0%,rgba(43,58,74,.82) 100%);z-index:-1}
.fade{opacity:0;transform:translateY(14px);animation:rise 1.1s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.logo{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,7vw,4.5rem);letter-spacing:.5em;margin-right:-.5em}
.line{width:0;height:1px;background:var(--accent);margin:22px auto 20px;animation:grow 1.2s var(--ease) .5s forwards}
@keyframes grow{to{width:64px}}
.tag{font-weight:200;font-size:.72rem;letter-spacing:.38em;text-transform:uppercase;color:var(--accent);margin-bottom:clamp(40px,8vh,72px)}
.choices{display:flex;gap:clamp(16px,4vw,48px);flex-wrap:wrap;justify-content:center}
.loc{position:relative;display:block;width:min(300px,80vw);padding:34px 20px 30px;color:var(--text);text-decoration:none;
  border:1px solid rgba(244,240,235,.18);transition:border-color .5s var(--ease),background .5s var(--ease),transform .5s var(--ease)}
.loc::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:var(--text);transition:width .6s var(--ease),left .6s var(--ease)}
.loc:hover,.loc:focus-visible{border-color:rgba(244,240,235,.5);background:rgba(244,240,235,.04);transform:translateY(-4px);outline:none}
.loc:hover::after,.loc:focus-visible::after{width:100%;left:0}
.loc small{display:block;font-weight:300;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.loc strong{display:block;font-family:var(--serif);font-weight:300;font-size:1.9rem;letter-spacing:.08em}
.loc em{display:block;margin-top:14px;font-style:normal;font-weight:200;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;opacity:0;transform:translateX(-6px);transition:all .5s var(--ease)}
.loc:hover em,.loc:focus-visible em{opacity:.8;transform:none}
body.leaving{opacity:0;transition:opacity .5s ease}
@media(prefers-reduced-motion:reduce){.bg-video{animation-duration:.01s}.fade,.line{animation-duration:.01s;animation-delay:0s}.loc,.loc em{transition:none}}
</style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
  <source src="taFTlVideos/ScreenRecording_10-05-2026%2011-45-30_1.mov">
</video>
<h1 class="logo fade">TAKATO</h1>
<div class="line"></div>
<p class="tag fade" style="--d:.7s">Select your location</p>
<nav class="choices">
  <a class="loc fade" style="--d:.9s" href="fortlauderdale.html"><small>Florida</small><strong>Fort Lauderdale</strong><em>Enter</em></a>
  <a class="loc fade" style="--d:1.05s" href="miami.html"><small>Florida</small><strong>Miami</strong><em>Enter</em></a>
</nav>
<script>
document.querySelectorAll('.loc').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();document.body.classList.add('leaving');setTimeout(()=>location.href=a.href,450)}));
</script>
</body>
</html>
